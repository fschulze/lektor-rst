[tox]
min_version = 4.22
envlist =
    py39-lektor33
    py{310,311,312,313,314}{,-lektor33}
    format
    ruff


[testenv]
dependency_groups = dev
commands =
    pytest {posargs}
set_env =
    # Put coverage files in .tox/py3xx/
    COVERAGE_FILE = {env_dir}{/}.coverage
    COVERAGE_HTML_DIR = {env_dir}{/}htmlcov
deps =
    lektor33: lektor == 3.*
    !lektor33: lektor >= 3.4.0b1


[testenv:format]
dependency_groups = ruff
commands = ruff format --check
skip_install = true


[testenv:ruff]
dependency_groups = ruff
commands = ruff check
skip_install = true
